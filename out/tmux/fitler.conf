# Fitler — generated from palette.json; do not edit
# source-file ~/.config/tmux/fitler.conf

set -g status-style "fg=#a8a49b,bg=#080809"
set -g status-left "#[fg=#0e0e0f,bg=#668db1,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#615e58]#{?client_prefix,#[fg=#d3a54c]^A ,}#[fg=#a8a49b]%H:%M #[fg=#0e0e0f,bg=#242428] #h "
set -g status-right-length 60

setw -g window-status-format "#[fg=#615e58] #I:#W "
setw -g window-status-current-format "#[fg=#f3f1ee,bg=#242428,bold] #I:#W "
setw -g window-status-activity-style "fg=#d3a54c,bg=#080809"
setw -g window-status-bell-style "fg=#c96256,bg=#080809"

set -g pane-border-style "fg=#161618"
set -g pane-active-border-style "fg=#d3a54c"

set -g message-style "fg=#0e0e0f,bg=#d3a54c,bold"
set -g message-command-style "fg=#e6e3dc,bg=#151517"

set -g mode-style "fg=#f3f1ee,bg=#242428"
set -g copy-mode-match-style "fg=#0e0e0f,bg=#d3a54c"
set -g copy-mode-current-match-style "fg=#0e0e0f,bg=#d3a54c"

set -g display-panes-active-colour "#d3a54c"
set -g display-panes-colour "#3f3d39"
set -g clock-mode-colour "#d3a54c"
